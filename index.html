<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghe văn bản</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Alpaq92/JSDoc@821695a884e0c0bb8592a635d9524bb3e116cd67/src/docToText.js"></script>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;padding-bottom:env(safe-area-inset-bottom);background:#f2f2f7;color:#111}
main{max-width:600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0.67em 0;min-width:0}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.controls .stop{grid-column:1/-1}
button.settings{width:auto;margin:0;padding:8px;background:transparent;font-size:24px}
label{display:block;margin:14px 0 6px;font-weight:600}
textarea,select,button,input[type=password],input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:12px;box-sizing:border-box}
textarea{min-height:180px}
input[type=range]{width:100%}
button{background:#007aff;color:#fff;border:0;margin-top:14px;font-weight:600}
button.stop{background:#ff3b30}
button.secondary{background:#555}
button:disabled{opacity:.6}
audio{width:100%;margin-top:8px}
.playlist{list-style:none;padding:0;margin:8px 0}
.playlist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd}
.playlist .track{flex:1;min-width:0;overflow-wrap:anywhere}
.playlist button{width:auto;margin:0;padding:8px 12px}
.playlist .delete{background:#ff3b30}
.documents{margin:16px 0;padding:12px;border:1px solid #ccc;border-radius:12px;background:#fff}
.documents h2{font-size:18px;margin:0 0 8px}
.documents p{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h1>🔊 Nghe văn bản</h1>
<button id="toggleToken" class="settings" type="button" aria-label="Cài đặt Token" aria-expanded="false" aria-controls="tokenSettings">⚙️</button>
</header>
<div id="tokenSettings" hidden>
  <label for="token">GitHub Personal Access Token (PAT)</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p id="tokenStatus" role="status" aria-live="polite"></p>
  <p>Token được lưu trên thiết bị này. Chỉ dùng trên thiết bị tin cậy; mã chạy trên trang có thể truy cập token. Cần quyền Actions: Read and write cho repository.</p>
  <button id="saveToken" class="secondary" type="button">Lưu token</button>
  <button id="clearToken" class="secondary" type="button">Xóa token</button>
</div>
<section class="documents" aria-labelledby="documentsHeading">
  <h2 id="documentsHeading">Tài liệu Google Drive</h2>
  <p id="documentsStatus" role="status" aria-live="polite"></p>
  <label for="documentsQuery">Tìm theo tên tệp (để trống để liệt kê)</label>
  <input id="documentsQuery" type="text" maxlength="200" placeholder="Tên tài liệu">
  <button id="documentsSearch" type="button">Tìm / liệt kê tài liệu</button>
  <label for="documentsResults">Kết quả</label>
  <select id="documentsResults" disabled><option value="">Chưa có kết quả</option></select>
  <button id="documentsLoad" type="button" disabled>Tải văn bản</button>
</section>
<label for="textInput">Văn bản</label>
<textarea id="textInput" placeholder="Nhập hoặc dán văn bản..."></textarea>
<label for="fileInput">Tải file lên</label>
<input type="file" id="fileInput" accept=".txt,text/plain,.doc,application/msword,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf,application/pdf">
<label for="voice">Giọng đọc</label>
<select id="voice">
 <optgroup label="Giọng Cloud chất lượng cao (Tạo MP3)">
  <option value="vi-VN-HoaiMyNeural">Hoài Mỹ - Nữ Tiếng Việt</option>
  <option value="vi-VN-NamMinhNeural">Nam Minh - Nam Tiếng Việt</option>
  <option value="en-US-AriaNeural">Aria - Nữ Tiếng Anh</option>
  <option value="en-US-GuyNeural">Guy - Nam Tiếng Anh</option>
  <option value="zh-CN-XiaoxiaoNeural">Xiaoxiao - Nữ Tiếng Trung</option>
  <option value="ja-JP-NanamiNeural">Nanami - Nữ Tiếng Nhật</option>
  <option value="ko-KR-SunHiNeural">SunHi - Nữ Tiếng Hàn</option>
 </optgroup>
 <optgroup id="deviceVoices" label="Giọng đọc nhanh trên máy (Nghe liền)"></optgroup>
</select>
<label for="rate">Tốc độ: <span id="rv">1.0</span>x</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<div class="controls">
  <button id="speak" type="button">Đọc ngay (Máy)</button>
  <button id="createCloud" type="button">Tạo MP3 (Cloud)</button>
  <button id="stop" class="stop" type="button">Dừng</button>
</div>
<p id="tokenSummaryStatus"></p>
<p id="cloudStatus" role="status" aria-live="polite"></p>
<button id="selectAll" class="secondary" type="button">Chọn toàn bộ văn bản</button>
<h2>Danh sách phát MP3</h2>
<audio id="player" controls preload="none"></audio>
<ol id="playlist" class="playlist" aria-label="Danh sách file MP3"></ol>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
let voices=[];
let speechRun=0;
let documentResults=[];
let documentsBusy=false;
function documentsStatus(message){$('documentsStatus').textContent=message;}
function documentsControls(){
  $('documentsSearch').disabled=documentsBusy;
  $('documentsResults').disabled=documentsBusy||!documentResults.length;
  $('documentsLoad').disabled=documentsBusy||!documentResults.length||!$('documentsResults').value;
}
function clearDocumentResults(){
  documentResults=[];
  $('documentsResults').replaceChildren(new Option('Chưa có kết quả',''));
  documentsControls();
}
async function documentsRequest(path){
  const response=await fetch(path,{
    credentials:'omit',redirect:'error',cache:'no-store',
    headers:{Accept:'application/json'}
  });
  if(!response.ok){
    throw new Error('Không thể tải dữ liệu tĩnh (HTTP '+response.status+').');
  }
  return response.json();
}
function documentsError(error){
  documentsStatus(error instanceof TypeError?'Không thể tải dữ liệu. Kiểm tra kết nối mạng.':error.message||'Không thể xử lý yêu cầu.');
}
$('documentsSearch').onclick=async()=>{
  const query=$('documentsQuery').value.trim();
  clearDocumentResults();
  documentsBusy=true;documentsControls();documentsStatus('Đang tìm kiếm...');
  try{
    const result=await documentsRequest('./documents.json');
    if(!Array.isArray(result.results))throw new Error('Danh sách tài liệu không hợp lệ.');
    documentResults=result.results.filter(item=>item&&typeof item.id==='string'&&/^[A-Za-z0-9_-]{1,200}$/.test(item.id)&&typeof item.title==='string'&&item.title&&item.title.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));
    $('documentsResults').replaceChildren();
    if(!documentResults.length){
      $('documentsResults').appendChild(new Option('Không có kết quả',''));
      documentsStatus('Không tìm thấy tài liệu.');
    }else{
      documentResults.forEach((item,index)=>{
        $('documentsResults').appendChild(new Option(item.title,String(index)));
      });
      documentsStatus('Tìm thấy '+documentResults.length+' tài liệu.');
    }
  }catch(error){documentsError(error);}
  finally{documentsBusy=false;documentsControls();}
};
$('documentsResults').onchange=documentsControls;
$('documentsLoad').onclick=async()=>{
  const item=documentResults[Number($('documentsResults').value)];
  if(!item)return;
  documentsBusy=true;documentsControls();documentsStatus('Đang tải văn bản...');
  try{
    const result=await documentsRequest('./documents/'+encodeURIComponent(item.id)+'.json');
    const text=typeof result.text==='string'?result.text.trim():'';
    if(!text)throw new Error('Không tìm thấy nội dung văn bản.');
    $('textInput').value=text;
    $('textInput').dispatchEvent(new Event('input',{bubbles:true}));
    $('textInput').dispatchEvent(new Event('change',{bubbles:true}));
    documentsStatus('Đã tải văn bản vào ô Văn bản. Bạn có thể đọc ngay hoặc tạo MP3.');
  }catch(error){documentsError(error);}
  finally{documentsBusy=false;documentsControls();}
};
documentsStatus('Tìm hoặc liệt kê tài liệu đã được đồng bộ từ Google Drive.');
documentsControls();
$('selectAll').onclick=()=>{$('textInput').focus();$('textInput').select();};
$('fileInput').onchange=event=>{
  const input=event.target;
  const file=input.files[0];
  if(!file)return;
  const isDoc=/\.doc$/i.test(file.name);
  const isDocx=/\.docx$/i.test(file.name);
  const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  $('speak').disabled=true;
  $('createCloud').disabled=true;
  $('cloudStatus').textContent='Đang đọc file...';
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      let text;
      if(isDoc)text=window.docToText(reader.result);
      else if(isDocx)text=(await mammoth.extractRawText({arrayBuffer:reader.result})).value;
      else if(isPdf){
        const pdfjsLib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs';
        const pdf=await pdfjsLib.getDocument({data:reader.result}).promise;
        try{
          const pages=[];
          for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){
            const page=await pdf.getPage(pageNumber);
            const content=await page.getTextContent();
            pages.push(content.items.map(item=>item.str).join(' '));
          }
          text=pages.join('\n');
        }finally{
          await pdf.destroy();
        }
      }else text=reader.result;
      if(input.files[0]!==file)return;
      if(isDoc&&text===null){
        $('textInput').value='';
        $('cloudStatus').textContent='Không thể đọc file .doc này. Chỉ hỗ trợ Word 97–2003 không bị mã hóa; hãy thử lưu thành .docx.';
        return;
      }
      if(!text.trim()){
        $('textInput').value='';
        $('cloudStatus').textContent=isPdf
          ?'Không tìm thấy văn bản trong PDF. Nếu đây là PDF scan/ảnh, ứng dụng chưa hỗ trợ OCR; hãy dùng PDF có thể chọn hoặc sao chép chữ.'
          :'File không chứa văn bản.';
        return;
      }
      $('textInput').value=text;
      $('cloudStatus').textContent='Đã tải văn bản từ file. Bạn có thể bấm “Đọc ngay (Máy)”.';
    }catch(error){
      if(input.files[0]===file)$('cloudStatus').textContent=isPdf
        ?'Không thể đọc PDF. Hãy kiểm tra file hoặc thử PDF có thể chọn/sao chép chữ.'
        :isDoc
          ?'Không thể đọc file .doc. Hãy kiểm tra file hoặc thử lưu thành .docx.'
          :'Không thể đọc file.';
    }finally{
      if(input.files[0]===file){
        $('speak').disabled=false;
        $('createCloud').disabled=false;
      }
    }
  };
  reader.onerror=()=>{
    if(input.files[0]===file){
      $('cloudStatus').textContent=isDoc
        ?'Không thể đọc file .doc. Hãy kiểm tra file hoặc thử lưu thành .docx.'
        :'Không thể đọc file.';
      $('speak').disabled=false;
      $('createCloud').disabled=false;
    }
  };
  if(isDoc||isDocx||isPdf)reader.readAsArrayBuffer(file);else reader.readAsText(file);
};
function loadVoices(){
  if(!synth)return;
  const selectedValue=$('voice').value;
  const previous=selectedValue.startsWith('device:')?voices[Number(selectedValue.slice(7))]:null;
  const ios=/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let linhCount=0;
  voices=synth.getVoices().map(voice=>{
    const vietnamese=/^vi/i.test(voice.lang);
    const linh=vietnamese&&/^linh\b/i.test(voice.name);
    if(linh)linhCount++;
    const enhanced=/enhanced|premium/i.test(voice.name+' '+voice.voiceURI)||(ios&&linh&&linhCount===2);
    return {voice,vietnamese,linh,enhanced};
  }).sort((a,b)=>Number(b.linh&&b.enhanced)-Number(a.linh&&a.enhanced)||Number(b.vietnamese)-Number(a.vietnamese)||a.voice.name.localeCompare(b.voice.name));
  $('deviceVoices').replaceChildren();
  voices.forEach((entry,index)=>{
    const o=document.createElement('option');
    o.value='device:'+index;
    o.textContent=(entry.enhanced?(entry.linh?'Linh':entry.voice.name)+' (Nâng cao)':entry.voice.name)+' ('+entry.voice.lang+')';
    $('deviceVoices').appendChild(o);
  });
  if(previous){
    const selected=voices.findIndex(entry=>entry.voice.name===previous.voice.name&&entry.voice.voiceURI===previous.voice.voiceURI&&entry.voice.lang===previous.voice.lang);
    $('voice').value=selected>=0?'device:'+selected:'vi-VN-HoaiMyNeural';
  }else if(!selectedValue.startsWith('device:')){
    $('voice').value=selectedValue;
  }
}
function bestDeviceVoice(){
  return voices.find(entry=>entry.linh&&entry.enhanced)
    ||voices.find(entry=>entry.vietnamese&&/natural|hoaimy/i.test(entry.voice.name+' '+entry.voice.voiceURI))
    ||voices.find(entry=>entry.vietnamese&&/google/i.test(entry.voice.name+' '+entry.voice.voiceURI))
    ||voices.find(entry=>entry.vietnamese);
}
function splitSpeechText(text,maxLength=180){
  const chunks=[];
  let remaining=text;
  while(remaining.length>maxLength){
    let split=remaining.lastIndexOf(' ',maxLength);
    if(split<=0)split=maxLength;
    chunks.push(remaining.slice(0,split).trim());
    remaining=remaining.slice(split).trim();
  }
  if(remaining)chunks.push(remaining);
  return chunks;
}
loadVoices();
if(synth)synth.onvoiceschanged=loadVoices;
$('rate').oninput=()=>$('rv').textContent=Number($('rate').value).toFixed(1);
$('speak').onclick=()=>{
  if(!synth||typeof SpeechSynthesisUtterance==='undefined'){$('cloudStatus').textContent='Trình duyệt không hỗ trợ đọc văn bản trên thiết bị.';return;}
  const t=$('textInput').value.trim();
  if(!t){$('cloudStatus').textContent='Hãy nhập văn bản trước khi đọc.';return;}
  try{
    const run=++speechRun;
    synth.cancel();
    const selected=$('voice').value;
    const v=(selected.startsWith('device:')?voices[Number(selected.slice(7))]:null)?.voice||bestDeviceVoice()?.voice;
    const voiceName=v?.name||'Tiếng Việt mặc định';
    $('cloudStatus').textContent='Đang đọc trên thiết bị (giọng: '+voiceName+').';
    synth.resume();
    const chunks=splitSpeechText(t);
    chunks.forEach((chunk,index)=>{
      const u=new SpeechSynthesisUtterance(chunk);
      if(v){u.voice=v;u.lang=v.lang;}else u.lang='vi-VN';
      u.rate=parseFloat($('rate').value);
      if(index===chunks.length-1)u.onend=()=>{if(run===speechRun)$('cloudStatus').textContent='Đọc xong.';};
      u.onerror=event=>{
        if(run!==speechRun)return;
        speechRun++;
        synth.cancel();
        $('cloudStatus').textContent='Không thể đọc trên thiết bị'+(event.error?' ('+event.error+')':'')+'.';
      };
      synth.speak(u);
    });
  }
  catch(error){$('cloudStatus').textContent='Không thể bắt đầu đọc trên thiết bị.';}
};
$('stop').onclick=()=>{
  speechRun++;
  if(synth)synth.cancel();
};
const api='https://api.github.com/repos/duongvantoan190224/nghe-van-ban';
const tokenKey='nghe-van-ban-github-token';
let audioUrl=null;
let currentAudioPath=null;
async function playTrack(file,ref='main',autoplay=false){
  try{
    const headers={Accept:'application/vnd.github.raw+json'};
    const token=$('token').value.trim();
    if(token)headers.Authorization='Bearer '+token;
    const path=file.path.split('/').map(encodeURIComponent).join('/');
    const response=await fetch(api+'/contents/'+path+'?ref='+encodeURIComponent(ref)+'&t='+Date.now(),{headers,cache:'no-store'});
    if(response.status===404){window.alert('Vui lòng tạo file MP3.');return false;}
    if(!response.ok)throw new Error('Không thể tải MP3 (HTTP '+response.status+').');
    const blob=await response.blob();
    if(!blob.size){window.alert('Vui lòng tạo file MP3.');return false;}
    const oldUrl=audioUrl;
    audioUrl=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
    currentAudioPath=file.path;
    $('player').src=audioUrl;
    $('player').load();
    if(oldUrl)URL.revokeObjectURL(oldUrl);
    if(autoplay)await $('player').play();
    return true;
  }catch(error){
    window.alert(error.message||'Không thể tải file MP3.');
    return false;
  }
}
async function loadPlaylist(){
  const playlist=$('playlist');
  playlist.replaceChildren();
  try{
    const headers={Accept:'application/vnd.github+json'};
    const token=$('token').value.trim();
    if(token)headers.Authorization='Bearer '+token;
    const response=await fetch(api+'/contents/audio?ref=main&t='+Date.now(),{headers,cache:'no-store'});
    if(!response.ok)return;
    const files=await response.json();
    const tracks=files.filter(file=>file.type==='file'&&/\.mp3$/i.test(file.name)).sort((a,b)=>b.name.localeCompare(a.name));
    tracks.forEach(file=>{
      const item=document.createElement('li');
      const name=document.createElement('span');
      name.className='track';
      name.textContent=file.name;
      const play=document.createElement('button');
      play.type='button';
      play.textContent='▶';
      play.setAttribute('aria-label','Phát '+file.name);
      play.onclick=()=>playTrack(file,'main',true);
      const remove=document.createElement('button');
      remove.type='button';
      remove.className='delete';
      remove.textContent='Xóa';
      remove.setAttribute('aria-label','Xóa '+file.name);
      remove.onclick=async()=>{
        if(!window.confirm('Xóa file '+file.name+' khỏi danh sách hiện tại? File có thể vẫn còn trong lịch sử Git.'))return;
        const token=$('token').value.trim();
        if(!token){window.alert('Hãy nhập GitHub token có quyền Contents: Read and write để xóa MP3.');return;}
        remove.disabled=true;
        try{
          const path=file.path.split('/').map(encodeURIComponent).join('/');
          const response=await fetch(api+'/contents/'+path,{
            method:'DELETE',
            headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({message:'Xóa '+file.name,sha:file.sha,branch:'main'})
          });
          if(!response.ok)throw new Error('Không xóa được MP3 (HTTP '+response.status+'). Kiểm tra quyền Contents: Read and write.');
          if(currentAudioPath===file.path){
            $('player').pause();
            $('player').removeAttribute('src');
            if(audioUrl)URL.revokeObjectURL(audioUrl);
            audioUrl=null;
            currentAudioPath=null;
          }
          await loadPlaylist();
        }catch(error){
          remove.disabled=false;
          window.alert(error.message||'Không thể xóa file MP3.');
        }
      };
      item.append(name,play,remove);
      playlist.appendChild(item);
    });
  }catch{return;}
}
$('toggleToken').onclick=()=>{
  const settings=$('tokenSettings');
  settings.hidden=!settings.hidden;
  $('toggleToken').setAttribute('aria-expanded',String(!settings.hidden));
};
const savedTokenMessage='✓ Token đã được lưu trên thiết bị này';
function updateTokenStatus(saved){
  const message=saved?savedTokenMessage:'Chưa có token được lưu trên thiết bị này.';
  $('tokenStatus').textContent=message;
  $('tokenSummaryStatus').textContent=message;
}
try{
  $('token').value=localStorage.getItem(tokenKey)||'';
  const saved=Boolean($('token').value.trim());
  updateTokenStatus(saved);
  if(saved)$('cloudStatus').textContent=savedTokenMessage;
}catch(error){
  $('tokenStatus').textContent='Không thể truy cập bộ nhớ trình duyệt.';
  $('tokenSummaryStatus').textContent='Không thể truy cập bộ nhớ trình duyệt.';
  $('cloudStatus').textContent='Không thể truy cập bộ nhớ trình duyệt.';
}
loadPlaylist();
$('saveToken').onclick=()=>{
  try{
    const token=$('token').value.trim();
    if(!token){$('cloudStatus').textContent='Hãy nhập token trước khi lưu.';return;}
    localStorage.setItem(tokenKey,token);
    updateTokenStatus(true);
    $('cloudStatus').textContent='Đã lưu token thành công. '+savedTokenMessage;
    loadPlaylist();
  }catch(error){$('cloudStatus').textContent='Không thể lưu token trên thiết bị.';}
};
$('clearToken').onclick=()=>{
  try{localStorage.removeItem(tokenKey);$('token').value='';updateTokenStatus(false);$('cloudStatus').textContent='Đã xóa token.';loadPlaylist();}
  catch(error){$('cloudStatus').textContent='Không thể xóa token trên thiết bị.';}
};
$('createCloud').onclick=async()=>{
  const text=$('textInput').value.trim();
  const token=$('token').value.trim();
  if(!text){$('cloudStatus').textContent='Hãy nhập văn bản.';return;}
  if(!token){$('cloudStatus').textContent='Hãy nhập GitHub token trong phần cài đặt.';return;}
  if(!window.crypto?.getRandomValues){$('cloudStatus').textContent='Trình duyệt không hỗ trợ tạo mã yêu cầu an toàn.';return;}
  const requestId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  const selected=$('voice').value;
  const voice=selected.startsWith('device:')?'vi-VN-HoaiMyNeural':selected;
  const ratePercent=Math.round((Number($('rate').value)-1)*100);
  const rate=(ratePercent>=0?'+':'')+ratePercent+'%';
  const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  $('createCloud').disabled=true;
  $('cloudStatus').textContent='Đang gửi yêu cầu...';
  try{
    const response=await fetch(api+'/actions/workflows/tts.yml/dispatches',{
      method:'POST',headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify({ref:'main',inputs:{text,voice,rate,request_id:requestId}})
    });
    if(!response.ok)throw new Error('Không gửi được yêu cầu (HTTP '+response.status+'). Kiểm tra token, quyền Actions và nội dung.');
    $('cloudStatus').textContent='GitHub đang tạo file MP3...';
    const deadline=Date.now()+10*60*1000;
    let completed=false;
    while(Date.now()<deadline){
      await new Promise(resolve=>setTimeout(resolve,5000));
      try{
        const commitResponse=await fetch(api+'/commits/main?t='+Date.now(),{headers,cache:'no-store'});
        if(!commitResponse.ok)continue;
        const commit=await commitResponse.json();
        const ref=encodeURIComponent(commit.sha);
        const metaResponse=await fetch(api+'/contents/audio/meta.json?ref='+ref+'&t='+Date.now(),{
          headers:{...headers,Accept:'application/vnd.github.raw+json'},cache:'no-store'
        });
        if(!metaResponse.ok)continue;
        const meta=await metaResponse.json();
        if(meta.request_id!==requestId)continue;
        const filename=typeof meta.filename==='string'&&/^[a-zA-Z0-9._-]+\.mp3$/.test(meta.filename)?meta.filename:'doc-van-ban.mp3';
        if(!await playTrack({path:'audio/'+filename,name:filename},commit.sha))continue;
        await loadPlaylist();
        $('cloudStatus').textContent='Đã xong!';
        completed=true;
        break;
      }catch(error){/* Thử lại khi mạng hoặc API tạm thời không khả dụng. */}
    }
    if(!completed)throw new Error('Chưa nhận được MP3 sau 10 phút. Kiểm tra lần chạy trong tab Actions; yêu cầu đang chờ có thể bị thay thế bởi yêu cầu mới.');
  }catch(error){$('cloudStatus').textContent=error.message||'Không thể kết nối GitHub. Hãy thử lại.';}
  finally{$('createCloud').disabled=false;}
};
</script>
