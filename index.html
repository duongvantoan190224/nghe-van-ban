<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghe văn bản</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs';
window.pdfjsLib=pdfjsLib;
</script>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;padding-bottom:env(safe-area-inset-bottom);background:#f2f2f7;color:#111}
main{max-width:600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0.67em 0}
button.settings{width:auto;margin:0;padding:8px;background:transparent;color:inherit;font-size:24px}
.controls{display:flex;gap:8px}
.controls button{width:auto;flex:1}
.controls button.stop{flex:0 0 auto}
label{display:block;margin:14px 0 6px;font-weight:600}
textarea,select,button,input[type=password],input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:12px;box-sizing:border-box}
textarea{min-height:180px}
input[type=range]{width:100%}
button{background:#007aff;color:#fff;border:0;margin-top:14px;font-weight:600}
button.stop{background:#ff3b30}
button.secondary{background:#555}
button:disabled{opacity:.6}
audio{width:100%;margin-top:8px}
</style>
</head>
<body>
<main>
<header>
<h1>🔊 Nghe văn bản</h1>
<button id="toggleToken" class="settings" type="button" aria-label="Cài đặt token GitHub" title="Cài đặt token GitHub" aria-expanded="false" aria-controls="tokenSettings">⚙️</button>
</header>
<div id="tokenSettings" hidden>
  <label for="token">GitHub Personal Access Token (PAT)</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p>Token được lưu trên thiết bị này. Chỉ dùng trên thiết bị tin cậy; mã chạy trên trang có thể truy cập token. Cần quyền Actions: Read and write cho repository.</p>
  <button id="saveToken" class="secondary" type="button">Lưu token</button>
  <button id="clearToken" class="secondary" type="button">Xóa token</button>
</div>
<label for="textInput">Văn bản</label>
<textarea id="textInput" placeholder="Nhập hoặc dán văn bản..."></textarea>
<label for="voice">Giọng đọc</label>
<select id="voice">
 <optgroup label="Giọng Cloud chất lượng cao (Tạo MP3)">
  <option value="vi-VN-HoaiMyNeural">Hoài Mỹ - Nữ Tiếng Việt</option>
  <option value="vi-VN-NamMinhNeural">Nam Minh - Nam Tiếng Việt</option>
  <option value="en-US-AriaNeural">Aria - Nữ Tiếng Anh</option>
  <option value="en-US-GuyNeural">Guy - Nam Tiếng Anh</option>
  <option value="zh-CN-XiaoxiaoNeural">Xiaoxiao - Nữ Tiếng Trung</option>
  <option value="ja-JP-NanamiNeural">Nanami - Nữ Tiếng Nhật</option>
  <option value="ko-KR-SunHiNeural">SunHi - Nữ Tiếng Hàn</option>
 </optgroup>
 <optgroup id="deviceVoices" label="Giọng đọc nhanh trên máy (Nghe liền)"></optgroup>
</select>
<label for="rate">Tốc độ: <span id="rv">1.0</span>x</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<div class="controls">
  <button id="speak" type="button">▶ Đọc ngay</button>
  <button id="createCloud" type="button">Tạo MP3</button>
  <button id="stop" class="stop" type="button">■ Dừng</button>
</div>
<p id="cloudStatus" role="status" aria-live="polite"></p>
<button id="selectAll" class="secondary" type="button">Chọn toàn bộ văn bản</button>
<label for="fileInput">Tải file lên</label>
<input type="file" id="fileInput" accept=".txt,text/plain,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf,application/pdf">
<h2>File MP3 mới nhất</h2>
<audio id="player" controls preload="none"></audio>
<p id="note"></p>
</main>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
let voices=[];
$('selectAll').onclick=()=>{$('textInput').focus();$('textInput').select();};
$('fileInput').onchange=event=>{
  const input=event.target;
  const file=input.files[0];
  if(!file)return;
  const isDocx=/\.docx$/i.test(file.name);
  const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      let text;
      if(isDocx)text=(await mammoth.extractRawText({arrayBuffer:reader.result})).value;
      else if(isPdf){
        const pdf=await pdfjsLib.getDocument({data:reader.result}).promise;
        const pages=[];
        for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){
          const page=await pdf.getPage(pageNumber);
          const content=await page.getTextContent();
          pages.push(content.items.map(item=>item.str).join(' '));
        }
        text=pages.join('\n');
        await pdf.destroy();
      }else text=reader.result;
      if(input.files[0]===file)$('textInput').value=text;
    }catch(error){
      if(input.files[0]===file)alert('Không thể đọc file.');
    }
  };
  reader.onerror=()=>{if(input.files[0]===file)alert('Không thể đọc file.');};
  if(isDocx||isPdf)reader.readAsArrayBuffer(file);else reader.readAsText(file);
};
function loadVoices(){
  if(!synth)return;
  const selectedValue=$('voice').value;
  const previous=selectedValue.startsWith('device:')?voices[Number(selectedValue.slice(7))]:null;
  const ios=/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let linhCount=0;
  voices=synth.getVoices().map(voice=>{
    const vietnamese=/^vi/i.test(voice.lang);
    const linh=vietnamese&&/^linh\b/i.test(voice.name);
    if(linh)linhCount++;
    const enhanced=/enhanced|premium/i.test(voice.name+' '+voice.voiceURI)||(ios&&linh&&linhCount===2);
    return {voice,vietnamese,linh,enhanced};
  }).sort((a,b)=>Number(b.linh&&b.enhanced)-Number(a.linh&&a.enhanced)||Number(b.vietnamese)-Number(a.vietnamese)||a.voice.name.localeCompare(b.voice.name));
  $('deviceVoices').replaceChildren();
  voices.forEach((entry,index)=>{
    const o=document.createElement('option');
    o.value='device:'+index;
    o.textContent=(entry.enhanced?(entry.linh?'Linh':entry.voice.name)+' (Nâng cao)':entry.voice.name)+' ('+entry.voice.lang+')';
    $('deviceVoices').appendChild(o);
  });
  if(previous){
    const selected=voices.findIndex(entry=>entry.voice.name===previous.voice.name&&entry.voice.voiceURI===previous.voice.voiceURI&&entry.voice.lang===previous.voice.lang);
    $('voice').value=selected>=0?'device:'+selected:'vi-VN-HoaiMyNeural';
  }else if(!selectedValue.startsWith('device:')){
    $('voice').value=selectedValue;
  }
}
function bestDeviceVoice(){
  return voices.find(entry=>entry.linh&&entry.enhanced)
    ||voices.find(entry=>entry.vietnamese&&/natural|hoaimy/i.test(entry.voice.name+' '+entry.voice.voiceURI))
    ||voices.find(entry=>entry.vietnamese&&/google/i.test(entry.voice.name+' '+entry.voice.voiceURI))
    ||voices.find(entry=>entry.vietnamese);
}
loadVoices();
if(synth)synth.onvoiceschanged=loadVoices;
$('rate').oninput=()=>$('rv').textContent=Number($('rate').value).toFixed(1);
$('speak').onclick=()=>{
  if(!synth){alert('Trình duyệt không hỗ trợ Web Speech API');return;}
  const t=$('textInput').value.trim();if(!t)return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(t);
  const selected=$('voice').value;
  const v=(selected.startsWith('device:')?voices[Number(selected.slice(7))]:bestDeviceVoice())?.voice;
  if(v){u.voice=v;u.lang=v.lang;}else u.lang='vi-VN';
  u.rate=parseFloat($('rate').value);
  synth.speak(u);
};
$('stop').onclick=()=>synth&&synth.cancel();
$('player').src='audio/doc-van-ban.mp3?t='+Date.now();
$('player').onerror=()=>$('note').textContent='Chưa có file MP3. Hãy chạy workflow để tạo.';
const api='https://api.github.com/repos/duongvantoan190224/nghe-van-ban';
const tokenKey='nghe-van-ban-github-token';
let audioUrl=null;
$('toggleToken').onclick=()=>{
  const settings=$('tokenSettings');
  settings.hidden=!settings.hidden;
  $('toggleToken').setAttribute('aria-expanded',String(!settings.hidden));
};
try{$('token').value=localStorage.getItem(tokenKey)||'';}catch(error){$('cloudStatus').textContent='Không thể truy cập bộ nhớ trình duyệt.';}
$('saveToken').onclick=()=>{
  try{
    const token=$('token').value.trim();
    if(!token){$('cloudStatus').textContent='Hãy nhập token trước khi lưu.';return;}
    localStorage.setItem(tokenKey,token);
    $('cloudStatus').textContent='Đã lưu token trên thiết bị.';
  }catch(error){$('cloudStatus').textContent='Không thể lưu token trên thiết bị.';}
};
$('clearToken').onclick=()=>{
  try{localStorage.removeItem(tokenKey);$('token').value='';$('cloudStatus').textContent='Đã xóa token.';}
  catch(error){$('cloudStatus').textContent='Không thể xóa token trên thiết bị.';}
};
$('createCloud').onclick=async()=>{
  const text=$('textInput').value.trim();
  const token=$('token').value.trim();
  if(!text){$('cloudStatus').textContent='Hãy nhập văn bản.';return;}
  if(!token){$('cloudStatus').textContent='Hãy nhập GitHub token trong phần cài đặt.';return;}
  if(!window.crypto?.getRandomValues){$('cloudStatus').textContent='Trình duyệt không hỗ trợ tạo mã yêu cầu an toàn.';return;}
  const requestId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  const selected=$('voice').value;
  const voice=selected.startsWith('device:')?'vi-VN-HoaiMyNeural':selected;
  const ratePercent=Math.round((Number($('rate').value)-1)*100);
  const rate=(ratePercent>=0?'+':'')+ratePercent+'%';
  const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  $('createCloud').disabled=true;
  $('cloudStatus').textContent='Đang gửi yêu cầu...';
  try{
    const response=await fetch(api+'/actions/workflows/tts.yml/dispatches',{
      method:'POST',headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify({ref:'main',inputs:{text,voice,rate,request_id:requestId}})
    });
    if(!response.ok)throw new Error('Không gửi được yêu cầu (HTTP '+response.status+'). Kiểm tra token, quyền Actions và nội dung.');
    $('cloudStatus').textContent='GitHub đang tạo file MP3...';
    const deadline=Date.now()+10*60*1000;
    let completed=false;
    while(Date.now()<deadline){
      await new Promise(resolve=>setTimeout(resolve,5000));
      try{
        const commitResponse=await fetch(api+'/commits/main?t='+Date.now(),{headers,cache:'no-store'});
        if(!commitResponse.ok)continue;
        const commit=await commitResponse.json();
        const ref=encodeURIComponent(commit.sha);
        const metaResponse=await fetch(api+'/contents/audio/meta.json?ref='+ref+'&t='+Date.now(),{
          headers:{...headers,Accept:'application/vnd.github.raw+json'},cache:'no-store'
        });
        if(!metaResponse.ok)continue;
        const meta=await metaResponse.json();
        if(meta.request_id!==requestId)continue;
        const audioResponse=await fetch(api+'/contents/audio/doc-van-ban.mp3?ref='+ref+'&t='+Date.now(),{
          headers:{...headers,Accept:'application/vnd.github.raw+json'},cache:'no-store'
        });
        if(!audioResponse.ok)continue;
        const blob=await audioResponse.blob();
        if(!blob.size)continue;
        const oldUrl=audioUrl;
        audioUrl=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
        $('player').src=audioUrl;
        $('player').load();
        if(oldUrl)URL.revokeObjectURL(oldUrl);
        $('note').textContent='Nhấn phát để nghe MP3 mới nhất.';
        $('cloudStatus').textContent='Đã xong!';
        completed=true;
        break;
      }catch(error){/* Thử lại khi mạng hoặc API tạm thời không khả dụng. */}
    }
    if(!completed)throw new Error('Chưa nhận được MP3 sau 10 phút. Kiểm tra lần chạy trong tab Actions; yêu cầu đang chờ có thể bị thay thế bởi yêu cầu mới.');
  }catch(error){$('cloudStatus').textContent=error.message||'Không thể kết nối GitHub. Hãy thử lại.';}
  finally{$('createCloud').disabled=false;}
};
</script>
</body>
</html>
