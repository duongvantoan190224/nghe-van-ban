name: Chuyển văn bản thành giọng nói

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Dán văn bản bạn muốn chuyển thành giọng nói"
        required: true
        type: string
      voice:
        description: "Chọn giọng đọc"
        required: true
        type: choice
        default: vi-VN-HoaiMyNeural
        options:
          - vi-VN-HoaiMyNeural
          - vi-VN-NamMinhNeural
          - en-US-AriaNeural
          - en-US-GuyNeural
          - zh-CN-XiaoxiaoNeural
          - ja-JP-NanamiNeural
          - ko-KR-SunHiNeural
      rate:
        description: "Tốc độ đọc (ví dụ: -50%, +0%, +100%)"
        required: true
        type: string
        default: "+0%"
      request_id:
        description: "Mã yêu cầu từ giao diện web (không bắt buộc)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tts-audio-main
  cancel-in-progress: false

jobs:
  text-to-speech:
    name: Tạo tệp âm thanh MP3
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt edge-tts
        run: python -m pip install --upgrade edge-tts

      - name: Chuyển văn bản thành giọng nói
        env:
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_RATE: ${{ inputs.rate }}
        run: python tts.py

      - name: Tải tệp MP3 xuống
        uses: actions/upload-artifact@v4
        with:
          name: audio-ket-qua
          path: output/doc-van-ban.mp3
          if-no-files-found: error
          retention-days: 3

      - name: Lưu MP3 vào thư mục audio trên nhánh main
        env:
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p audio
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          import uuid
          from pathlib import Path

          request_id = os.environ.get("INPUT_REQUEST_ID", "")
          if not re.fullmatch(r"[a-f0-9]{32}", request_id):
              request_id = uuid.uuid4().hex
          timestamp = datetime.datetime.now(datetime.timezone.utc)
          filename = f"{timestamp.strftime('%Y%m%d-%H%M%S')}-{request_id}.mp3"
          Path("audio", filename).write_bytes(Path("output/doc-van-ban.mp3").read_bytes())
          metadata = {
              "timestamp": timestamp.isoformat(),
              "voice": os.environ["INPUT_VOICE"],
              "excerpt": os.environ["INPUT_TEXT"][:200],
              "request_id": request_id,
              "filename": filename,
          }
          Path("audio/meta.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AUDIO_FILENAME={filename}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "audio/$AUDIO_FILENAME" audio/meta.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
          else
            git commit -m "Thêm audio/$AUDIO_FILENAME"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
