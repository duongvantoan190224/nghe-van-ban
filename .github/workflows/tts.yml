name: Chuyển văn bản thành giọng nói

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Dán văn bản bạn muốn chuyển thành giọng nói"
        required: true
        type: string
      voice:
        description: "Chọn giọng đọc"
        required: true
        type: choice
        default: vi-VN-HoaiMyNeural
        options:
          - vi-VN-HoaiMyNeural
          - vi-VN-NamMinhNeural
          - en-US-AriaNeural
          - en-US-GuyNeural
          - zh-CN-XiaoxiaoNeural
          - ja-JP-NanamiNeural
          - ko-KR-SunHiNeural
      rate:
        description: "Tốc độ đọc (ví dụ: -50%, +0%, +100%)"
        required: true
        type: string
        default: "+0%"
      request_id:
        description: "Mã yêu cầu từ giao diện web (không bắt buộc)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tts-audio-main
  cancel-in-progress: false

jobs:
  text-to-speech:
    name: Tạo tệp âm thanh MP3
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt edge-tts
        run: python -m pip install --upgrade edge-tts

      - name: Chuyển văn bản thành giọng nói
        env:
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_RATE: ${{ inputs.rate }}
        run: python tts.py

      - name: Tải tệp MP3 xuống
        uses: actions/upload-artifact@v4
        with:
          name: audio-ket-qua
          path: output/doc-van-ban.mp3
          if-no-files-found: error
          retention-days: 3

      - name: Lưu MP3 vào thư mục audio trên nhánh main
        env:
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p audio
          cp output/doc-van-ban.mp3 audio/doc-van-ban.mp3
          python -c 'import datetime, json, os; from pathlib import Path; Path("audio/meta.json").write_text(json.dumps({"timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(), "voice": os.environ["INPUT_VOICE"], "excerpt": os.environ["INPUT_TEXT"][:200], "request_id": os.environ["INPUT_REQUEST_ID"]}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/doc-van-ban.mp3 audio/meta.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
          else
            git commit -m "Cập nhật audio/doc-van-ban.mp3"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
