# Include this file in nginx's http context. Replace proxy.example.com.
map $http_origin $drive_cors_origin {
    default "";
    "https://duongvantoan190224.github.io" "https://duongvantoan190224.github.io";
}
limit_req_zone $binary_remote_addr zone=drive_requests:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=drive_connections:10m;

server {
    listen 80;
    server_name proxy.example.com;
    return 301 https://proxy.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name proxy.example.com;
    ssl_certificate /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        limit_req zone=drive_requests burst=10 nodelay;
        limit_req_status 429;
        limit_conn drive_connections 3;
        limit_conn_status 429;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $drive_cors_origin always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 60s;
    }
}
